name: Release

# Publishes a release when VERSION on main names a version that hasn't been
# released yet (or when a v* tag is pushed). The workflow creates the tag.
# Running apps see the new release and offer it as an update.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d ' \r\n' < VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/* ]] && git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "v$V is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$V"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.v.outputs.skip == 'false'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.v.outputs.skip == 'false'
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...

      - name: Build
        if: steps.v.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist/WarTable
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.appVersion=${VERSION}" \
            -o dist/WarTable.exe .
          cp dist/WarTable.exe dist/WarTable/
          sed "s/^WAR TABLE$/WAR TABLE v${VERSION}/" packaging/README.txt > dist/WarTable/README.txt
          cp -r addon/WarTableCompanion dist/WarTable/
          (cd dist && zip -qr "WarTable-v${VERSION}.zip" WarTable)
          (cd dist && sha256sum WarTable.exe "WarTable-v${VERSION}.zip" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "War Table v${VERSION}" > notes.md; fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: War Table v${{ steps.v.outputs.version }}
          body_path: notes.md
          files: |
            dist/WarTable.exe
            dist/WarTable-v*.zip
            dist/SHA256SUMS.txt
