name: Release

# Publishes a release when VERSION on main names a version that hasn't been
# released yet (or when a v* tag is pushed). The workflow creates the tag.
# If Artifact Signing is configured, WarTable.exe is signed before release.
# Running apps see the new release and offer it as an update.
#
# Signing setup (repo Settings > Secrets and variables > Actions):
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   variables: ARTIFACT_SIGNING_ENDPOINT (e.g. https://eus.codesigning.azure.net/),
#              ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # lets azure/login use OpenID Connect; no stored passwords

jobs:
  release:
    runs-on: windows-2025
    env:
      SIGNING_READY: ${{ secrets.AZURE_CLIENT_ID != '' && vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Decide version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d ' \r\n' < VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/* ]] && git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "v$V is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$V (signing configured: $SIGNING_READY)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.v.outputs.skip == 'false'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.v.outputs.skip == 'false'
        run: |
          go vet ./...
          go test ./...

      - name: Build
        if: steps.v.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.appVersion=${VERSION}" \
            -o dist/WarTable.exe .

      - name: Sign in to Azure
        if: steps.v.outputs.skip == 'false' && env.SIGNING_READY == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign WarTable.exe
        if: steps.v.outputs.skip == 'false' && env.SIGNING_READY == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check signature
        if: steps.v.outputs.skip == 'false' && env.SIGNING_READY == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\WarTable.exe
          Write-Host "Signature: $($sig.Status) by $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "WarTable.exe is not validly signed" }

      - name: Package
        if: steps.v.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist/WarTable
          cp dist/WarTable.exe dist/WarTable/
          sed "s/^WAR TABLE$/WAR TABLE v${VERSION}/" packaging/README.txt > dist/WarTable/README.txt
          cp -r addon/WarTableCompanion dist/WarTable/
          pwsh -NoProfile -Command "Compress-Archive -Path dist/WarTable -DestinationPath dist/WarTable-v${VERSION}.zip -Force"
          (cd dist && sha256sum WarTable.exe "WarTable-v${VERSION}.zip" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "War Table v${VERSION}" > notes.md; fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: War Table v${{ steps.v.outputs.version }}
          body_path: notes.md
          files: |
            dist/WarTable.exe
            dist/WarTable-v*.zip
            dist/SHA256SUMS.txt
