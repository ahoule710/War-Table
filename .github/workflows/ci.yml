name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui -s -w" -o WarTable.exe .
